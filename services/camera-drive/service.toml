id          = "camera-drive"
title       = "Camera"
description = "Photos and tapes offloaded from the Aiptek, and its live view"
icon        = "camera"

[route]
port     = 8444
upstream = "http://127.0.0.1:8081"

[run]
# camera-live and camera-offload@ are started by udev when the camera is
# plugged in; they are not the service manager's to start or stop.
units         = ["camera-drive-web.service"]
ready_path    = "/api/state"
start_timeout = "30s"
auto          = true
idle_stop     = "20m"
exclusive     = ["foreground"]

[memory]
# Measured ~37 MB RSS idle; thumbnails and zip downloads add more.
budget = "60M"
max    = "150M"

[access]
level = "use"

# Deleting from the camera: admins and the owner only.
[[access.rules]]
path  = "/api/wipe"
level = "admin"

# Power off moves to the platform (owner only, in the gateway) in Phase 4.
[[access.rules]]
path  = "/api/power"
level = "deny"
