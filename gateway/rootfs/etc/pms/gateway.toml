# pms-gateway configuration. Every value here is also the built-in default;
# they are listed so they are visible.

# Login, portal and admin. Services listen on the route.port in their manifest.
listen = ":443"

# Plain-HTTP listener that redirects to https. Empty until Phase 4 moves
# camera-drive off port 80; then ":80".
redirect_http = ""

# service.toml files, installed by `platform/deploy.sh gateway`.
services_dir = "/etc/pms/services"

database = "/var/lib/pms-gateway/gateway.db"

# Drop real certificate files here (e.g. Let's Encrypt) and restart. When both
# are missing, a self-signed pair is generated in their place.
tls_cert = "/var/lib/pms-gateway/tls/cert.pem"
tls_key  = "/var/lib/pms-gateway/tls/key.pem"

# Extra DNS names for a generated certificate; the hostname and
# <hostname>.local are always included.
hostnames = []

# A session ends after this long unused, and after session_max regardless.
session_idle = "12h"
session_max  = "168h"
