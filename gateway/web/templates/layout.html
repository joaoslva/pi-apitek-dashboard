{{define "top"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Pocket server</title>
<link rel="stylesheet" href="{{.CSS}}">
</head>
<body>
<header class="bar">
  <a class="brand" href="{{.Home}}">Pocket server</a>
  {{with .Session}}
  <nav>
    {{if .User.Owner}}<a href="{{$.Home}}admin/">Users</a> <a href="{{$.Home}}admin/audit">Audit log</a>{{end}}
    <a href="{{$.Home}}account">{{.User.Name}}</a>
    <form method="post" action="{{$.Home}}logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link">Sign out</button></form>
  </nav>
  {{end}}
</header>
<main>
{{with .Flash}}<p class="flash">{{.}}</p>{{end}}
{{with .Error}}<p class="error">{{.}}</p>{{end}}
{{end}}

{{define "bottom"}}</main>
</body>
</html>
{{end}}
