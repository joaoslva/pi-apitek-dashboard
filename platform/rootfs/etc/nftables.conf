#!/usr/sbin/nft -f
#
# pi-mobile-server host firewall: inbound is denied unless listed here.
#
# Only table inet pms is replaced. There is deliberately no `flush ruleset`:
# it would also wipe the nm-shared-* tables NetworkManager adds while the
# hotspot is up.

destroy table inet pms

table inet pms {
	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept
		ct state established,related accept
		ct state invalid drop

		# IPv6 does not work at all without neighbour discovery and router adverts.
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert, packet-too-big, destination-unreachable, time-exceeded, parameter-problem } accept
		icmp type echo-request limit rate 5/second accept
		icmpv6 type echo-request limit rate 5/second accept

		# ssh; http (only redirects to https once the gateway owns it); https;
		# the gateway's per-service ports (route.port in service.toml)
		tcp dport { 22, 80, 443, 8443-8450 } accept

		# mDNS, so <hostname>.local resolves for clients that support it
		udp dport 5353 accept

		# DHCPv6 replies come back to the link-local address, which conntrack
		# does not match to a request sent to a multicast group.
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		# DHCP and DNS from NetworkManager's dnsmasq while wlan0 is the hotspot.
		# Revisit in Phase 6 if the hotspot moves to another interface.
		iifname "wlan0" udp dport { 53, 67 } accept
		iifname "wlan0" tcp dport 53 accept
	}
}
